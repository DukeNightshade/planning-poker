# ================================
# Allgemein
# ================================
spring.application.name=planning-poker

# ================================
# Reverse Proxy
# Nur setzen, wenn der Proxy den Prefix NICHT abschneidet,
# sonst liefert er ihn per X-Forwarded-Prefix.
# ================================
server.servlet.context-path=${APP_CONTEXT_PATH:}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# ================================
# Datenbank (per ENV ueberschreibbar -> siehe Docker/Compose)
# Default: lokale H2-Datei fuer die Entwicklung
# ================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/planningpoker}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ================================
# JPA / Hibernate
# ================================
# Schema kommt aus den Flyway-Migrationen (db/migration), Hibernate prüft nur
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ================================
# Flyway
# ================================
# Bestehende, von Hibernate angelegte Datenbanken bei Version 0 einhängen,
# damit V1 (idempotent) auch dort läuft und Fehlendes ergänzt
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ================================
# Planning Poker
# ================================
# Sessions ohne Aktivität seit so vielen Stunden werden gelöscht
planningpoker.cleanup.max-idle-hours=${CLEANUP_MAX_IDLE_HOURS:24}
planningpoker.cleanup.cron=${CLEANUP_CRON:0 0 3 * * *}
# So lange darf ein Teilnehmer getrennt sein, bevor er entfernt wird
planningpoker.reconnect-grace-seconds=${RECONNECT_GRACE_SECONDS:20}

# ================================
# H2 Console (im Container/Prod deaktivieren via ENV)
# ================================
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ================================
# Thymeleaf
# ================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ================================
# Actuator (Health-Check fuer Docker)
# ================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true