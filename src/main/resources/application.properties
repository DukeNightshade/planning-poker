# ================================
# Allgemein
# ================================
spring.application.name=planning-poker

# ================================
# Datenbank (per ENV ueberschreibbar -> siehe Docker/Compose)
# Default: lokale H2-Datei fuer die Entwicklung
# ================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/planningpoker}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ================================
# H2 Console (im Container/Prod deaktivieren via ENV)
# ================================
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ================================
# Thymeleaf
# ================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ================================
# Actuator (Health-Check fuer Docker)
# ================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true