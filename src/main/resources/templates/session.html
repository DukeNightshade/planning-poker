<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">Planning Poker</title>
    <link rel="icon" type="image/png" th:href="@{/images/siv-logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Session-spezifisch: Viewport füllen, kein globales Scrollen */
        html, body       { height: 100%; }
        body             { overflow: hidden; }
        .header--session { flex-shrink: 0; }
        .footer          { flex-shrink: 0; }

        .skip-link {
            position: absolute; top: -48px; left: 1rem;
            background: var(--color-primary, #004178); color: #ffffff;
            padding: 0.5rem 1rem; border-radius: 0 0 6px 6px;
            font-family: var(--font-main, sans-serif), sans-serif;
            font-size: 0.9rem; font-weight: 600; text-decoration: none;
            z-index: 10000; transition: top 0.15s ease;
        }
        .skip-link:focus { top: 0; outline: 3px solid #ffffff; outline-offset: 2px; }

        .lang-btn {
            color: rgba(255,255,255,0.7); font-size: 0.85rem; font-weight: 600;
            text-decoration: none; padding: 0.2rem 0.5rem; border-radius: 4px;
            border: 2px solid rgba(255,255,255,0.25);
            font-family: var(--font-main, sans-serif), sans-serif; transition: all 0.2s;
        }
        a.lang-btn:hover,
        a.lang-btn[aria-current="true"] {
            color: #ffffff !important;
            border-color: rgba(255,255,255,0.7) !important;
            background: #1a5fa0;
        }
    </style>
</head>
<body>

<a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>

<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<div id="joinModal" class="join-modal-backdrop"
     role="dialog" aria-modal="true" aria-labelledby="joinModalTitle">
    <div class="join-modal">
        <h2 class="join-modal__title" id="joinModalTitle"
            th:text="#{home.join.title}">Session beitreten</h2>
        <p class="join-modal__subtitle">
            <span th:text="#{nav.roomcode}">Raumcode:</span>
            <span class="join-modal__roomcode" th:text="${roomCode}"></span>
        </p>
        <div class="join-modal__error" id="joinModalError" role="alert"></div>
        <div class="form">
            <label class="form__label" for="joinModalName"
                   th:text="#{home.join.name}">Ihr Name</label>
            <input class="form__input" type="text" id="joinModalName"
                   th:placeholder="#{home.join.name.placeholder}"
                   autocomplete="off" required>
            <label class="form__label" for="joinModalRole"
                   th:text="#{home.join.role}">Ihre Rolle</label>
            <select class="form__select" id="joinModalRole">
                <option value="DEVELOPER"     th:text="#{role.developer}">Entwickler</option>
                <option value="TESTER"        th:text="#{role.tester}">Tester</option>
                <option value="PRODUCT_OWNER" th:text="#{role.product_owner}">Product Owner (Beobachter)</option>
                <option value="IT_ARCHITECT"  th:text="#{role.it_architect}">IT-Architekt</option>
            </select>
            <button class="btn btn--primary" id="joinModalBtn" style="width:100%;"
                    th:text="#{home.join.submit}">Beitreten</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    globalThis.i18n = {
        toast: {
            revealed:          /*[[#{toast.revealed}]]*/ '',
            newround:          /*[[#{toast.newround}]]*/ '',
            copied:            /*[[#{toast.copied}]]*/ '',
            promotedSelf:      /*[[#{toast.promoted.self}]]*/ '',
            demotedSelf:       /*[[#{toast.demoted.self}]]*/ '',
            settings:          /*[[#{toast.settings}]]*/ '',
            ticketAdded:       /*[[#{toast.ticket.added}]]*/ '',
            ticketSelected:    /*[[#{toast.ticket.selected}]]*/ '',
            joined:            /*[[#{toast.joined}]]*/ '',
            left:              /*[[#{toast.left}]]*/ '',
            moderatorPromoted: /*[[#{toast.moderator.promoted}]]*/ '',
            reconnected:       /*[[#{toast.reconnected}]]*/ '',
            errorCreate:       /*[[#{toast.error.create}]]*/ '',
            errorJoin:         /*[[#{toast.error.join}]]*/ '',
            errorTickets:      /*[[#{toast.error.tickets}]]*/ '',
            errorCopy:         /*[[#{toast.error.copy}]]*/ '',
            errorPromote:      /*[[#{toast.error.promote}]]*/ '',
            errorAction:       /*[[#{toast.error.action}]]*/ '',
            disconnected:      /*[[#{toast.warning.disconnected}]]*/ '',
            disconnectedSub:   /*[[#{toast.warning.disconnected.sub}]]*/ '',
            errorNameInvalid:  /*[[#{toast.error.name.invalid}]]*/ '',
            errorNameTaken:    /*[[#{toast.error.name.taken}]]*/ '',
        },
        nav:     { copied:  /*[[#{nav.copied}]]*/ '' },
        session: { voted:   /*[[#{session.voted}]]*/ '' },
        roles: {
            DEVELOPER:     /*[[#{role.developer}]]*/ '',
            TESTER:        /*[[#{role.tester}]]*/ '',
            PRODUCT_OWNER: /*[[#{role.product_owner.short}]]*/ '',
            MODERATOR:     /*[[#{role.moderator}]]*/ '',
            IT_ARCHITECT:  /*[[#{role.it_architect}]]*/ ''
        },
        labels: {
            moderator:    /*[[#{role.moderator}]]*/ '',
            moderatorStar: /*[[#{session.moderator.star}]]*/ '',
            you:          /*[[#{session.you}]]*/ 'Du',
            waiting:      /*[[#{session.waiting}]]*/ '',
            method:       /*[[#{session.sidebar.method}]]*/ '',
            participants: /*[[#{session.sidebar.participants}]]*/ '',
            ticketsAdd:   /*[[#{tickets.add}]]*/ '',
            ticketsInput: /*[[#{tickets.input.placeholder}]]*/ '',
            ticketsSubmit: /*[[#{tickets.submit}]]*/ ''
        }
    };
</script>

<header class="header header--session">
    <div class="header__top">
        <img th:src="@{/images/siv-logo-weiss.png}" alt="SIV.AG" class="header__logo-img">
        <span class="header__app-title" th:text="#{app.title}">Planning Poker</span>
        <nav aria-label="Sprachauswahl" style="margin-left:auto; display:flex; gap:0.5rem; align-items:center;">
            <a th:href="@{/session/__${roomCode}__(lang=de)}"
               class="lang-btn"
               th:attr="aria-current=${#locale.language == 'de'} ? 'true' : null"
               th:text="#{nav.lang.de}"
               aria-label="Sprache: Deutsch">DE</a>
            <a th:href="@{/session/__${roomCode}__(lang=en)}"
               class="lang-btn"
               th:attr="aria-current=${#locale.language == 'en'} ? 'true' : null"
               th:text="#{nav.lang.en}"
               aria-label="Sprache: Englisch">EN</a>
        </nav>
    </div>
    <div class="header__bottom">
        <div class="header__left">
            <a href="/" class="header__back" th:text="#{nav.dashboard}">&#8592; Dashboard</a>
        </div>
        <div class="header__right">
            <span class="header__roomcode-label" th:text="#{nav.roomcode}">Raumcode:</span>
            <span class="header__roomcode" id="roomCodeDisplay" th:text="${roomCode}"></span>
            <button class="header__copy-btn" id="copyBtn"
                    onclick="copyRoomCode()" th:text="#{nav.copy}">Kopieren</button>
            <button class="btn--icon" id="settingsBtn" style="display:none;"
                    onclick="toggleSettings()"
                    aria-label="Einstellungen öffnen" aria-expanded="false">&#9881;&#65039;</button>
        </div>
    </div>
</header>

<main id="main-content" class="session">

    <div class="settings-panel" id="settingsPanel" style="display:none; grid-column: 1 / -1;">
        <div class="settings-panel__header">
            <h3 th:text="#{settings.title}">Einstellungen</h3>
            <button class="btn--icon" onclick="toggleSettings()"
                    aria-label="Einstellungen schließen">&#x2715;</button>
        </div>
        <div class="settings-panel__body">
            <label class="settings__toggle" for="settingShowTopic">
                <span th:text="#{settings.show_topic}">Ticket-Modul anzeigen</span>
                <input type="checkbox" id="settingShowTopic"
                       th:checked="${showTopic}" onchange="saveSettings()">
            </label>
            <label class="settings__toggle" for="settingModeratorCanVote">
                <span th:text="#{settings.moderator_vote}">Moderator darf mitwählen</span>
                <input type="checkbox" id="settingModeratorCanVote"
                       th:checked="${moderatorCanVote}" onchange="saveSettings()">
            </label>
            <label class="settings__toggle" for="settingAutoReveal">
                <span th:text="#{settings.auto_reveal}">Automatisch aufdecken</span>
                <input type="checkbox" id="settingAutoReveal"
                       th:checked="${autoReveal}" onchange="saveSettings()">
            </label>
        </div>
    </div>

    <aside class="ticket-sidebar" id="ticketSidebar" style="display:none;" aria-label="Ticket-Liste">
        <h3 class="sidebar__title" th:text="#{tickets.title}">Tickets</h3>
        <ul class="ticket-sidebar__list" id="ticketSidebarList"></ul>
        <div id="addTicketForm" style="display:none; margin-top: 0.75rem;">
            <input class="form__input" type="text" id="newTicketInput"
                   th:placeholder="#{tickets.input.placeholder}"
                   onkeydown="if(event.key==='Enter') submitNewTicket()">
            <div class="ticket-form__actions">
                <button class="btn--remove" onclick="cancelAddTicket()"
                        aria-label="Abbrechen">✕</button>
                <button class="btn btn--primary" onclick="submitNewTicket()"
                        th:text="#{tickets.submit}">Hinzufügen</button>
            </div>
        </div>
        <button class="btn btn--outline" id="addTicketBtn"
                style="display:none; width:100%; margin-top: 0.75rem; font-size: 0.85rem;"
                onclick="showAddTicketForm()" th:text="#{tickets.add}">+ Ticket hinzufügen</button>
    </aside>

    <section class="session__poker" id="pokerPane" aria-label="Poker-Tisch">

        <div class="session__topic" id="topicBar">
            <span class="session__topic-title" th:text="#{session.topic.label}">Aktuelles Ticket:</span>
            <span class="session__topic-text"  id="topicText"
                  th:text="#{session.topic.empty}">&#8211;</span>
        </div>

        <div id="discussionLabel" style="display:none;"
             class="poker-pane__discussion-label"
             th:text="#{session.discussion.label}"
             aria-live="polite">&#x1F4AC; Diskussionsmodus</div>

        <div class="session__actions" id="moderatorActions" style="display:none;">
            <button class="btn btn--primary"   onclick="revealCards()"
                    th:text="#{session.reveal}">Karten aufdecken</button>
            <button class="btn btn--secondary" onclick="resetRound()"
                    th:text="#{session.newround}">Neue Runde</button>
        </div>

        <div id="pokerTable" style="width:100%;" aria-label="Pokertisch"></div>

        <div class="cards" id="cardArea" style="justify-content: center; padding: 1rem 0;">
            <div th:if="${estimationMethod == 'FIBONACCI'}"
                 class="cards__grid" style="justify-content:center;">
                <button class="card-btn"
                        th:each="v : ${'?,☕,0,0.5,1,2,3,5,8,13,20,40,100'.split(',')}"
                        th:text="${v}" th:attr="data-value=${v}"
                        onclick="selectCard(this)"></button>
            </div>
            <div th:if="${estimationMethod == 'T_SHIRT'}"
                 class="cards__grid" style="justify-content:center;">
                <button class="card-btn"
                        th:each="v : ${'?,☕,XS,S,M,L,XL,XXL'.split(',')}"
                        th:text="${v}" th:attr="data-value=${v}"
                        onclick="selectCard(this)"></button>
            </div>
            <div th:if="${estimationMethod == 'POWERS_OF_TWO'}"
                 class="cards__grid" style="justify-content:center;">
                <button class="card-btn"
                        th:each="v : ${'?,☕,1,2,4,8,16,32,64'.split(',')}"
                        th:text="${v}" th:attr="data-value=${v}"
                        onclick="selectCard(this)"></button>
            </div>
        </div>

        <div id="resultsArea" style="display:none;" aria-live="polite"></div>
        <ul  id="resultsList"  style="display:none;"></ul>

    </section>

    <aside class="session__sidebar" aria-label="Teilnehmer-Übersicht">
        <h3 class="sidebar__title" id="sidebarTitle"
            th:text="#{session.sidebar.participants}">Teilnehmer</h3>
        <ul class="sidebar__list" id="participantList" aria-label="Teilnehmerliste"></ul>
        <div class="sidebar__method-block">
            <div class="sidebar__method-label" th:text="#{session.sidebar.method}">Methode</div>
            <div class="sidebar__method-value"
                 th:text="${estimationMethod == 'FIBONACCI' ? methodLabels['FIBONACCI'] :
                           (estimationMethod == 'T_SHIRT'   ? methodLabels['T_SHIRT'] :
                                                              methodLabels['POWERS_OF_TWO'])}">
            </div>
        </div>
    </aside>

</main>

<footer class="footer">&copy; 2026 <span th:text="#{app.footer}">SIV.AG &#8211; Internes Tool</span></footer>

<div style="display:none;">
    <span id="voteStatus"   th:text="#{session.waiting}">Warte auf Abstimmung...</span>
    <span id="progressBar"></span>
</div>

<div id="sessionData" th:attr="data-roomcode=${roomCode}" style="display:none;"></div>

<div id="playerData" style="display:none;">
    <span th:each="p : ${participants}" class="player-entry"
          th:attr="data-player-id=${p.id},
                   data-player-name=${p.name},
                   data-player-role=${p.role.name()},
                   data-player-moderator=${p.isModerator()}"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/utils.js}"></script>
<script th:src="@{/js/stats.js}"></script>
<script th:src="@{/js/tickets.js}"></script>
<script th:src="@{/js/render.js}"></script>
<script th:src="@{/js/actions.js}"></script>
<script th:src="@{/js/poker.js}"></script>

</body>
</html>
