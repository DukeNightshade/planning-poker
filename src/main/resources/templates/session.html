<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Poker – SIV.AG</title>
    <link rel="icon" type="image/png" th:href="@{/images/siv-logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Toast Container -->
<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<header class="header header--session">
    <div class="header__top">
        <img th:src="@{/images/siv-logo.png}"
             alt="SIV.AG"
             class="header__logo-img">
        <span class="header__app-title">Planning Poker</span>
    </div>
    <div class="header__bottom">
        <div class="header__left">
            <a href="/" class="header__back">&#8592; Dashboard</a>
        </div>
        <div class="header__right">
            <span class="header__roomcode-label">Raumcode:</span>
            <span class="header__roomcode" id="roomCodeDisplay" th:text="${roomCode}"></span>
            <button class="header__copy-btn" id="copyBtn" onclick="copyRoomCode()">Kopieren</button>
            <button class="btn--icon" id="settingsBtn" style="display:none;" onclick="toggleSettings()">⚙️</button>
        </div>
    </div>
</header>

<main class="session">

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel" style="display:none; grid-column: 1 / -1;">
        <div class="settings-panel__header">
            <h3>Einstellungen</h3>
            <button class="btn--icon" onclick="toggleSettings()">✕</button>
        </div>
        <div class="settings-panel__body">
            <label class="settings__toggle">
                <span>Ticket-Modul anzeigen</span>
                <input type="checkbox" id="settingShowTopic"
                       th:checked="${showTopic}" onchange="saveSettings()">
            </label>
            <label class="settings__toggle">
                <span>Moderator darf mitwählen</span>
                <input type="checkbox" id="settingModeratorCanVote"
                       th:checked="${moderatorCanVote}" onchange="saveSettings()">
            </label>
            <label class="settings__toggle">
                <span>Automatisch aufdecken</span>
                <input type="checkbox" id="settingAutoReveal"
                       th:checked="${autoReveal}" onchange="saveSettings()">
            </label>
        </div>
    </div>

    <!-- Ticket-Sidebar (links) -->
    <aside class="ticket-sidebar" id="ticketSidebar" style="display:none;">
        <h3 class="sidebar__title">Tickets</h3>
        <ul class="ticket-sidebar__list" id="ticketSidebarList">
            <!-- wird via JS befüllt -->
        </ul>
        <div id="addTicketForm" style="display:none; margin-top: 0.75rem;">
            <div class="ticket-entry">
                <input class="form__input" type="text" id="newTicketInput"
                       placeholder="Ticket-Titel" style="font-size: 0.85rem;">
                <button class="btn--remove" onclick="cancelAddTicket()">✕</button>
            </div>
            <button class="btn btn--primary"
                    style="width:100%; margin-top: 0.5rem; font-size: 0.85rem;"
                    onclick="submitNewTicket()">
                Hinzufügen
            </button>
        </div>
        <button class="btn btn--outline" id="addTicketBtn"
                style="display:none; width:100%; margin-top: 0.75rem; font-size: 0.85rem;"
                onclick="showAddTicketForm()">
            + Ticket hinzufügen
        </button>
    </aside>

    <!-- Poker Tisch (Mitte) -->
    <section class="session__poker" id="pokerPane">

        <!-- Aktuelles Ticket -->
        <div class="session__topic" id="topicBar">
            <span class="session__topic-title">Aktuelles Ticket:</span>
            <span class="session__topic-text" id="topicText">–</span>
        </div>

        <!-- Diskussionsmodus Label -->
        <div id="discussionLabel" style="display:none;"
             class="poker-pane__discussion-label">
            💬 Diskussionsmodus
        </div>

        <!-- SVG wird hier von JS eingefügt -->
        <div id="pokerTable" style="width:100%; min-height:500px;"></div>

        <!-- Karten zum Wählen -->
        <div class="cards" id="cardArea" style="justify-content: center; padding: 1rem 0;">
            <div th:if="${estimationMethod == 'FIBONACCI'}"
                 class="cards__grid" style="justify-content:center;">
                <button class="card-btn"
                        th:each="v : ${'?,☕,0,0.5,1,2,3,5,8,13,20,40,100'.split(',')}"
                        th:text="${v}"
                        th:attr="data-value=${v}"
                        onclick="selectCard(this)">
                </button>
            </div>
            <div th:if="${estimationMethod == 'T_SHIRT'}"
                 class="cards__grid" style="justify-content:center;">
                <button class="card-btn"
                        th:each="v : ${'?,☕,XS,S,M,L,XL,XXL'.split(',')}"
                        th:text="${v}"
                        th:attr="data-value=${v}"
                        onclick="selectCard(this)">
                </button>
            </div>
            <div th:if="${estimationMethod == 'POWERS_OF_TWO'}"
                 class="cards__grid" style="justify-content:center;">
                <button class="card-btn"
                        th:each="v : ${'?,☕,1,2,4,8,16,32,64'.split(',')}"
                        th:text="${v}"
                        th:attr="data-value=${v}"
                        onclick="selectCard(this)">
                </button>
            </div>
        </div>

        <!-- State-Tracking für JS -->
        <div id="resultsArea" style="display:none;"></div>
        <ul id="resultsList" style="display:none;"></ul>

        <!-- Moderator Aktionen -->
        <div class="session__actions" id="moderatorActions"
             style="display:none; justify-content:center; padding: 0 1rem 1rem;">
            <button class="btn btn--primary" onclick="revealCards()">
                Karten aufdecken
            </button>
            <button class="btn btn--secondary" onclick="resetRound()">
                Neue Runde
            </button>
        </div>

    </section>

    <!-- Teilnehmer-Sidebar (rechts) -->
    <aside class="session__sidebar">
        <h3 class="sidebar__title" id="sidebarTitle">Teilnehmer</h3>
        <ul class="sidebar__list" id="participantList">
            <!-- wird via JS befüllt -->
        </ul>
        <div class="sidebar__method-block">
            <div class="sidebar__method-label">Methode</div>
            <div class="sidebar__method-value"
                 th:text="${estimationMethod == 'FIBONACCI' ? 'Fibonacci' :
                           (estimationMethod == 'T_SHIRT'   ? 'T-Shirt Größen' :
                                                              'Zweierpotenzen')}">
            </div>
        </div>
    </aside>

</main>

<footer class="footer">
    &copy; 2026 SIV.AG – Internes Tool
</footer>

<!-- Status-Daten für JS -->
<div style="display:none;">
    <span id="voteStatus">Warte auf Abstimmung...</span>
    <span id="progressBar"></span>
</div>

<!-- Sessiondaten für JavaScript -->
<div id="sessionData"
     th:attr="data-roomcode=${roomCode}"
     style="display:none;">
</div>

<!-- Spieler-Daten für JS -->
<div id="playerData" style="display:none;">
    <span th:each="p : ${participants}"
          class="player-entry"
          th:attr="data-player-id=${p.id},
                   data-player-name=${p.name},
                   data-player-role=${p.role.name()},
                   data-player-moderator=${p.isModerator()}">
    </span>
</div>

<!-- Scripts — Reihenfolge beachten -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/utils.js}"></script>
<script th:src="@{/js/stats.js}"></script>
<script th:src="@{/js/tickets.js}"></script>
<script th:src="@{/js/render.js}"></script>
<script th:src="@{/js/actions.js}"></script>
<script th:src="@{/js/poker.js}"></script>

</body>
</html>
